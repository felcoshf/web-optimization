<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="styles.css">
    <title>Main</title>
</head>
<body>
    <header class="back_black_head">
        <section class="container">
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img class="logo" src="media\etazhi-logotip-vektor-48.jpg">
                </a>
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <button type="button" class="nav-link" data-bs-toggle="modal" data-bs-target="#1">Войти</button>
                <div class="modal fade" id="1" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Вход в аккаунт</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form class="form">
                            <input class="form_decor" placeholder="Логин">
                            <input class="form_decor" placeholder="Пароль">
                            <input class="form_decor" type="text" placeholder="ФИО">
                            <input class="form_decor" type="tel" placeholder="Телефон">
                            <input class="form_decor" type="email" placeholder="Почта">
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отправить</button>
                    </div>
                    </div>
                </div>
            </div>
        </li>

        <li class="nav-item">
            <button type="button" class="nav-link" data-bs-toggle="modal" data-bs-target="#2">Регистрация</button>
                <div class="modal fade" id="2" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Создание аккаунта</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form class="form">
                            <input class="form_decor form-label" placeholder="Логин">
                            <input class="form_decor" placeholder="Пароль">
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отправить</button>
                    </div>
                    </div>
                </div>
            </div>
        </li>
        </ul>
        </div>
    </nav>
</section>
</header>
    
    <main>
        <section></section>
    </main>

</body>
</html>
